name: CI
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci --prefix infra
      - run: npm run build --prefix infra
      - run: npm test --prefix infra
      - run: npm run synth --prefix infra -- -c stage=ci

  build:
    runs-on: ubuntu-latest
    env:
      NAME: opendds-performance-dashboard
    steps:
      - name: Checkout opendds-performance-dashboard
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            ui/package-lock.json
      - name: Install server
        run: npm ci --prefix server
      - name: Check server lint
        run: npm run lint:check --prefix server
      - name: Install UI
        run: npm ci --prefix ui
      - name: Check UI lint
        run: npm run lint:check --prefix ui
      - name: Test UI
        run: npm test --prefix ui -- --runInBand
      - name: Build UI
        run: npm run build --prefix ui
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{env.NAME}}
          path: ui/dist
